{% if tags %}
    <ul class="m-0 flex h-fit list-none flex-wrap gap-[.4rem] p-0">
        {% for tag in tags %}
            <li class="rounded-2xl border border-[oklch(80%_0_0)] bg-[oklch(92%_0_0)] px-[.4rem] py-[.1rem] text-[.8rem] font-semibold">{{ tag }}</li>
        {% endfor %}
    </ul>
{% endif %}
