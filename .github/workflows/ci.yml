name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installation des dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Formatage (ruff)
        run: ruff format --check .

      - name: Typage (mypy)
        run: mypy .

      - name: Migrations à jour
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test

  tailwind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      # Le CLI de Tailwind (environ 110 Mo) n'est téléchargé qu'une fois par version.
      - uses: actions/cache@v6
        with:
          path: .django_tailwind_cli
          key: tailwind-cli-${{ hashFiles('app_gestion/settings.py') }}

      - name: Construction de la feuille Tailwind
        run: python manage.py tailwind build
