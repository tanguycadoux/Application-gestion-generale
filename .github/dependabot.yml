# Mises à jour automatiques des dépendances (#242) : une PR par semaine et par
# écosystème, les mises à jour mineures et correctives regroupées.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      mineures:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      mineures:
        update-types: [minor, patch]
