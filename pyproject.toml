[tool.ruff]
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# Jeu de règles explicite, indépendant des valeurs par défaut de ruff
select = [
    "E4", "E7", "E9",  # pycodestyle : erreurs (hors style, géré par le formateur)
    "F",               # pyflakes
    "I",               # tri des imports
    "B",               # bugbear
    "UP",              # syntaxe Python moderne
    "DJ",              # bonnes pratiques Django
]
ignore = [
    "DJ001",  # null=True sur des champs texte : correction avec migration, voir #17
]
