{% if notes %}
    <ul class="list-disc pl-6">
        {% for note in notes %}
            <li><a class="text-primary-40 underline" href="{% url 'note_taking:note_detail' note.pk %}">Note du <time datetime="{{ note.date|date:'Y-m-d' }}">{{ note.date|date:'l j F Y' }}</time></a></li>
        {% endfor %}
    </ul>
{% else %}
    <p class="text-sm text-slate-600">Aucune.</p>
{% endif %}
