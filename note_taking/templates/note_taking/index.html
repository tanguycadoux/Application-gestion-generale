{% extends "note_taking/base.html" %}

{% block extra_head %}
    {{ block.super }}
    <title>Accueil</title>
{% endblock extra_head %}

{% block content %}
    <h1>Gestion des notes</h1>

    {% url 'note_taking:new_note' as url %}
    <a class="button-tw {% if request.path == url %}button-tw--active{% endif %} button-with-icon" href="{{ url }}">
        <span class="material-symbols-rounded">add</span>
        <span>Nouvelle note</span>
    </a>
{% endblock content %}
