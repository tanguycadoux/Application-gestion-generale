{% extends "todolist/base.html" %}
{% load ui %}

{% block extra_head %}
    {{ block.super }}
    <title>Accueil</title>
{% endblock extra_head %}

{% block content %}
    <h1>Supprimer "{{ object.title }}" ?</h1>

    <form method="post">
        {% csrf_token %}
        {% button "Oui, supprimer" %}
    </form>

    <a href="{% url 'todolist:todo_detail' object.pk %}">Annuler</a>
{% endblock content %}
